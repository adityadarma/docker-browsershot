[PHP]
; JSON bodies with inline HTML can be large; keep in sync with
; client_max_body_size in nginx.conf.
post_max_size = 10M
upload_max_filesize = 10M

memory_limit = 256M

; On Linux this counts CPU time only; time spent waiting on Chromium is
; bounded by the Browsershot/Symfony Process timeout instead.
max_execution_time = 60

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
; Code is baked into the image, so never re-check file timestamps.
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 32M
