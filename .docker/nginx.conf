worker_processes auto;
pcre_jit on;

error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Keep in sync with post_max_size in php.ini.
    client_max_body_size 10m;
    client_body_buffer_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # Trust X-Forwarded-For only from private networks (reverse proxy / ingress).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 8000 default_server;
        listen [::]:8000 default_server;
        server_name _;

        root /app/public;
        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Everything is handled by the front controller.
        location / {
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;

            # Must be >= the max `timeout` accepted by the API (300s).
            # Keep in sync with request_terminate_timeout in www.conf.
            fastcgi_read_timeout 310s;
            fastcgi_buffers 16 64k;
            fastcgi_buffer_size 64k;
        }

        location = /health {
            access_log off;
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }
    }
}
