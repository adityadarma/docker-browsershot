[global]
error_log = /proc/self/fd/2
log_level = warning
daemonize = no

[www]
listen = /run/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

user = nginx
group = nginx

; Every request spawns a Chromium process (~150-300 MB each), so keep the
; worker count low and tune it per host with PHP_FPM_MAX_CHILDREN.
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
pm.process_idle_timeout = 10s

; Must be >= the max `timeout` accepted by the API (300s) + overhead.
; Keep in sync with fastcgi_read_timeout in nginx.conf.
request_terminate_timeout = 310s

; Send worker stdout/stderr to the container log.
catch_workers_output = yes
decorate_workers_output = no

; Pass container env (APP_KEY, APP_DEBUG, BROWSERSHOT_*) to PHP.
clear_env = no
